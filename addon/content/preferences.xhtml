<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="babeldoc-for-zotero-preferences"
      class="main-section"
      onload="ZoteroTranslateFilesPreferences.initializePane(document, window)">
  <linkset>
    <html:link rel="localization" href="babeldoc-for-zotero.ftl" />
  </linkset>

  <html:div>
    <html:label for="babeldoc-for-zotero-preferences-base-url"
                data-l10n-id="babeldoc-for-zotero-pref-base-url" />
    <html:input id="babeldoc-for-zotero-preferences-base-url"
                type="text"
                preference="extensions.babeldoc-for-zotero.baseURL"
                autocomplete="off" />
  </html:div>

  <html:div>
    <html:label for="babeldoc-for-zotero-preferences-api-key"
                data-l10n-id="babeldoc-for-zotero-pref-api-key" />
    <html:input id="babeldoc-for-zotero-preferences-api-key"
                type="password"
                preference="extensions.babeldoc-for-zotero.apiKey"
                autocomplete="off" />
  </html:div>

  <html:div>
    <html:label for="babeldoc-for-zotero-preferences-model"
                data-l10n-id="babeldoc-for-zotero-pref-model" />
    <html:input id="babeldoc-for-zotero-preferences-model"
                type="text"
                preference="extensions.babeldoc-for-zotero.model"
                autocomplete="off" />
  </html:div>

  <html:div>
    <html:label for="babeldoc-for-zotero-preferences-max-output-tokens"
                data-l10n-id="babeldoc-for-zotero-pref-max-output-tokens" />
    <html:input id="babeldoc-for-zotero-preferences-max-output-tokens"
                type="number"
                min="1024"
                step="1"
                preference="extensions.babeldoc-for-zotero.maxOutputTokens" />
  </html:div>

  <html:div>
    <html:label for="babeldoc-for-zotero-preferences-max-requests"
                data-l10n-id="babeldoc-for-zotero-pref-max-requests" />
    <html:input id="babeldoc-for-zotero-preferences-max-requests"
                type="number"
                min="1"
                step="1"
                preference="extensions.babeldoc-for-zotero.maxRequests" />
  </html:div>

  <html:div>
    <html:input id="babeldoc-for-zotero-preferences-repair-failed"
                type="checkbox"
                preference="extensions.babeldoc-for-zotero.repairFailed" />
    <html:label for="babeldoc-for-zotero-preferences-repair-failed"
                data-l10n-id="babeldoc-for-zotero-pref-repair-failed" />
  </html:div>

  <html:div>
    <html:input id="babeldoc-for-zotero-preferences-translate-references"
                type="checkbox"
                preference="extensions.babeldoc-for-zotero.translateReferences" />
    <html:label for="babeldoc-for-zotero-preferences-translate-references"
                data-l10n-id="babeldoc-for-zotero-pref-translate-references" />
  </html:div>

  <html:div>
    <html:label for="babeldoc-for-zotero-preferences-babeldoc-path"
                data-l10n-id="babeldoc-for-zotero-pref-babeldoc-path" />
    <html:input id="babeldoc-for-zotero-preferences-babeldoc-path"
                type="text"
                preference="extensions.babeldoc-for-zotero.babeldocPath"
                autocomplete="off" />
    <html:button id="babeldoc-for-zotero-preferences-browse"
                 type="button"
                 data-l10n-id="babeldoc-for-zotero-pref-browse" />
  </html:div>

  <html:p data-l10n-id="babeldoc-for-zotero-pref-request-help" />
  <html:p data-l10n-id="babeldoc-for-zotero-pref-babeldoc-help" />
  <html:button id="babeldoc-for-zotero-preferences-test"
               type="button"
               data-l10n-id="babeldoc-for-zotero-pref-test" />
  <html:div id="babeldoc-for-zotero-preferences-api-status"
            role="status"
            aria-live="polite"
            data-l10n-id="babeldoc-for-zotero-pref-api-idle" />
  <html:div id="babeldoc-for-zotero-preferences-path-status"
            role="status"
            aria-live="polite"
            data-l10n-id="babeldoc-for-zotero-pref-path-idle" />
</vbox>
